# -----------------------------------------------------------------------------
# 1. СИСТЕМА СБОРКИ (BUILD SYSTEM)
# -----------------------------------------------------------------------------
# Указывает, какие инструменты необходимы для сборки пакета.
# setuptools >= 61.0 поддерживает стандарт PEP 621 (метаданные в pyproject.toml).
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# 2. МЕТАДАННЫЕ ПРОЕКТА (PROJECT METADATA)
# -----------------------------------------------------------------------------
# Стандартное описание проекта согласно PEP 621.
[project]
name = "autodealer-api"             # Имя для PyPI (рекомендуется использовать дефисы)
version = "0.1.0"                   # Версия пакета (можно управлять через git tags)
description = "Firebird Database Wrapper Library"
readme = "README.md"                # Файл с описанием (необходимо создать)
requires-python = ">=3.10"          # Минимальная версия Python
license = { text = "MIT" }          # Лицензия


# Зависимости времени выполнения
dependencies = [
    "fdb>=2.0.1",                   # Драйвер Firebird
]

# Дополнительные зависимости (например, для разработки)
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# -----------------------------------------------------------------------------
# 3. КОНФИГУРАЦИЯ SETUPTOOLS
# -----------------------------------------------------------------------------
# Критически важно для структуры 'src': указываем, где искать пакеты.
[tool.setuptools.packages.find]
where = ["src"]                     # Искать пакеты внутри директории src
include = ["autodealerAPI*"]        # Явное включение пакета (учитывая регистр)

