[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodealer-api"
version = "0.1.7"
description = "Firebird Database Wrapper Library"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

dependencies = [
    "fdb>=2.0.4",
    "Levenshtein==0.27.3",      # python-Levenshtein удалён (дубликат)
    "pydantic>=2.12.5",         # typing_* и annotated-types добавятся автоматически
    "PyPika==0.51.1",
    "RapidFuzz==3.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]                 # ← Оставляем, т.к. код внутри src/
include = ["autodealerAPI*"]    # ← Точное совпадение с именем папки
